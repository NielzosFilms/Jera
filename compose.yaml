name: jera
services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: jera
            POSTGRES_USER: jera
            POSTGRES_PASSWORD: jera
        ports:
            - "5432:5432"
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U jera -d jera"]
            interval: 5s
            timeout: 3s
            retries: 10
